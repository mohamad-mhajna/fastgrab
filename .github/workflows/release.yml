name: release

# Builds the standalone Windows programs (no Python needed) and publishes them on
# the Releases page. Triggered by publishing a release / pushing a version tag.
#   FastGrab.exe      - the desktop app (window)
#   fastgrab-cli.exe  - the command-line tool
# (Different names on purpose: Windows file names ignore case, so
#  "fastgrab.exe" and "FastGrab.exe" would overwrite each other.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the files to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller "yt-dlp[default]" imageio-ffmpeg
          VIDEO="--hidden-import fastgrab_video --collect-data yt_dlp_ejs --collect-all imageio_ffmpeg"
          pyinstaller --onefile --console  --name fastgrab-cli --icon assets/fastgrab.ico $VIDEO fastgrab.py
          pyinstaller --onefile --windowed --name FastGrab --icon assets/fastgrab.ico \
                      --add-data "ui:ui" $VIDEO fastgrab_app.py

      - name: Test fastgrab-cli.exe (command line)
        timeout-minutes: 5
        shell: bash
        run: |
          python tests/server.py --port 8765 --size-mb 16 --rate-kb 4096 > server.log &
          sleep 4
          ./dist/fastgrab-cli.exe --version
          ./dist/fastgrab-cli.exe http://127.0.0.1:8765/file.bin -c 8 -o smoke
          ./dist/fastgrab-cli.exe "http://127.0.0.1:8765/watch" -o smoke-video
          test "$(sha256sum smoke-video/*.mp4 | cut -d' ' -f1)" = "$(head -1 server.log | cut -d' ' -f2)"
          expected=$(head -1 server.log | cut -d' ' -f2)
          actual=$(sha256sum smoke/file.bin | cut -d' ' -f1)
          echo "expected $expected"; echo "actual   $actual"
          test "$expected" = "$actual"

      - name: Test FastGrab.exe (app backend)
        timeout-minutes: 10
        shell: bash
        env:
          FASTGRAB_APP_CMD: dist/FastGrab.exe
        run: python -m unittest tests.test_app -v

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum FastGrab.exe fastgrab-cli.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/FastGrab.exe
            dist/fastgrab-cli.exe
            dist/SHA256SUMS.txt
          append_body: true
          body: |

            ### Downloads
            - **FastGrab.exe**: the desktop app. Double-click it to open the window. Video mode (YouTube, TikTok, Instagram…) is built in. For YouTube, install [Node.js](https://nodejs.org) or [Deno](https://deno.com).
            - **fastgrab-cli.exe**: the command-line version (`.\fastgrab-cli.exe URL -c 16`).

            No Python needed. Windows SmartScreen may warn about an unknown publisher, because the files aren't code-signed: click **More info → Run anyway**. You can check the files against `SHA256SUMS.txt`.
