name: release

# Builds the standalone Windows programs (no Python needed) and publishes them on
# the Releases page. Triggered by publishing a release / pushing a version tag.
#   FastGrab.exe  - the desktop app (window)
#   fastgrab.exe  - the command-line tool
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --console  --name fastgrab --icon assets/fastgrab.ico fastgrab.py
          pyinstaller --onefile --windowed --name FastGrab --icon assets/fastgrab.ico \
                      --add-data "ui:ui" fastgrab_app.py

      - name: Test fastgrab.exe (command line)
        shell: bash
        run: |
          python tests/server.py --port 8765 --size-mb 16 --rate-kb 4096 > server.log &
          sleep 4
          ./dist/fastgrab.exe --version
          ./dist/fastgrab.exe http://127.0.0.1:8765/file.bin -c 8 -o smoke
          expected=$(head -1 server.log | cut -d' ' -f2)
          actual=$(sha256sum smoke/file.bin | cut -d' ' -f1)
          echo "expected $expected"; echo "actual   $actual"
          test "$expected" = "$actual"

      - name: Test FastGrab.exe (app backend)
        shell: bash
        env:
          FASTGRAB_APP_CMD: dist/FastGrab.exe
        run: python -m unittest tests.test_app -v

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum FastGrab.exe fastgrab.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FastGrab.exe
            dist/fastgrab.exe
            dist/SHA256SUMS.txt
          append_body: true
          body: |

            ### Downloads
            - **FastGrab.exe**: the desktop app. Double-click it to open the window.
            - **fastgrab.exe**: the command-line version (`.\fastgrab.exe URL -c 16`).

            No Python needed. Windows SmartScreen may warn about an unknown publisher, because the files aren't code-signed: click **More info → Run anyway**. You can check the files against `SHA256SUMS.txt`.
