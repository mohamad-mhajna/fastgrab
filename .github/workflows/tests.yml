name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Show proxy settings (macOS)
        if: runner.os == 'macOS'
        run: scutil --proxy || true
      - name: Install video support (optional dependency, exercised by the video tests)
        run: python -m pip install "yt-dlp[default]"
      - run: python -m unittest discover -s tests -v
