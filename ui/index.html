<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>FastGrab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M18 5 9 18h6l-2 9 10-14h-6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080d; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#eef0f6; --muted:#9097a8; --faint:#5d6475;
  --a1:#8b5cf6; --a2:#22d3ee; --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --r:14px; --r-sm:9px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","SF Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
/* ambient light behind the glass, slowly drifting */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(110px);opacity:.38;pointer-events:none;z-index:0}
body::before{width:620px;height:620px;left:-160px;top:-220px;background:#6d28d9;animation:drift1 28s ease-in-out infinite alternate}
body::after{width:560px;height:560px;right:-180px;bottom:-240px;background:#0891b2;animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,80px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-110px,-70px) scale(1.1)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s var(--ease),background .15s,color .15s,border-color .15s,box-shadow .2s,filter .15s}
button:active:not(:disabled){transform:scale(.96)}
input,select{font:inherit;color:inherit}
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px 1fr;height:100vh;gap:12px;padding:12px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 50px -20px rgba(0,0,0,.6)}
.enter{animation:panelIn .6s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.99)}}
.num,.tab{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;padding:16px 12px;gap:2px;position:relative;min-height:0;overflow-y:auto}
.side::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(139,92,246,.7);flex:none}
.logo svg{transition:transform .4s var(--spring)}
.brand:hover .logo svg{transform:rotate(-12deg) scale(1.1)}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--faint);font-size:11px;margin-top:-2px}
.navs{position:relative;display:flex;flex-direction:column;gap:2px}
.navind{position:absolute;inset-inline:0;top:0;height:38px;border-radius:var(--r-sm);background:rgba(139,92,246,.16);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35);transition:transform .38s var(--ease),height .38s var(--ease),opacity .2s;pointer-events:none;opacity:0}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;height:38px;border-radius:var(--r-sm);color:var(--muted);text-align:start;width:100%}
.nav:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav.on{color:var(--text)}
.nav svg{width:17px;height:17px;flex:none}
.nav .n{margin-inline-start:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;transition:color .2s}
.nav.on .n{color:#c4b5fd}
.nav .n.bump{animation:bump .4s var(--spring)}
@keyframes bump{50%{transform:scale(1.45);color:#fff}}
.side .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--faint);padding:14px 10px 6px}
.side .grow{flex:1;min-height:10px}
.card{padding:12px 13px;border-radius:12px;margin-top:8px}
.speedcard{background:linear-gradient(160deg,rgba(139,92,246,.18),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.25)}
.speedcard .lbl{font-size:11px;color:var(--muted)}
.speedcard .val{font-size:22px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.speedcard .sub{font-size:11.5px;color:var(--muted)}
.updcard{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.3);display:none;animation:panelIn .5s var(--ease)}
.updcard.on{display:block}
.updcard b{display:block;font-size:12.5px}
.updcard span{font-size:11.5px;color:var(--muted)}
.updcard button{margin-top:8px;width:100%;height:30px;border-radius:8px;background:rgba(52,211,153,.18);color:#a7f3d0;font-size:12px;font-weight:600}
.updcard button:hover{background:rgba(52,211,153,.28)}
.schedcard{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);display:none;font-size:11.5px;color:var(--muted)}
.schedcard.on{display:block}
.schedcard b{color:#bfdbfe;display:block;font-size:12px}
.sidebtns{display:flex;gap:6px;margin-top:10px}
.sidebtn{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px}
.sidebtn:hover{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}
.sidebtn svg{width:16px;height:16px}
.sidebtn:hover svg.gear{transform:rotate(60deg)}
.sidebtn svg.gear{transition:transform .5s var(--ease)}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-width:0;min-height:0}
.addbar{display:flex;gap:10px;padding:10px;align-items:center}
.url{flex:1;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:11px;padding:0 12px;height:44px;transition:border-color .2s,box-shadow .25s}
.url:focus-within{border-color:rgba(139,92,246,.7);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.url svg{width:18px;height:18px;color:var(--faint);flex:none;transition:color .2s,transform .3s var(--spring)}
.url:focus-within svg{color:#c4b5fd;transform:rotate(-20deg)}
.url input{flex:1;background:none;border:0;outline:none;font-size:14px;user-select:text;min-width:0}
.url input::placeholder{color:var(--faint)}
.conns{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--muted);font-size:12.5px;white-space:nowrap}
.conns select{background:transparent;border:0;outline:none;color:var(--text);font-weight:600;cursor:pointer}
option{background:#151722;color:var(--text)}
.go{height:44px;padding:0 20px;border-radius:11px;background:var(--grad);background-size:160% 160%;font-weight:650;color:white;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px -10px rgba(139,92,246,.9);white-space:nowrap;animation:gradmove 6s ease infinite}
@keyframes gradmove{50%{background-position:100% 100%}}
.go:hover{filter:brightness(1.1);box-shadow:0 14px 34px -10px rgba(139,92,246,1)}
.go svg{width:17px;height:17px;transition:transform .3s var(--spring)}
.go:hover svg{transform:translateY(2px)}

.listwrap{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.listhead{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.listhead h2{margin:0;font-size:15px;font-weight:650}
.listhead .hint{color:var(--faint);font-size:12px}
.listhead .sp{flex:1}
.search{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:32px;transition:border-color .2s}
.search:focus-within{border-color:rgba(139,92,246,.6)}
.search svg{width:14px;height:14px;color:var(--faint)}
.search input{background:none;border:0;outline:none;width:170px;font-size:12.5px;user-select:text}
.ghost{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:12.5px;white-space:nowrap}
.ghost:hover{color:var(--text);border-color:var(--line-2)}

.cols,.row{display:grid;grid-template-columns:minmax(220px,1fr) 92px minmax(170px,240px) 92px 78px 116px 104px;align-items:center;gap:12px;padding:0 18px}
.cols{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);height:30px;border-bottom:1px solid var(--line)}
.rows{overflow-y:auto;overflow-x:hidden;flex:1;padding:4px 0 8px}
.rows::-webkit-scrollbar{width:10px}.rows::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.row{height:58px;margin:2px 8px;padding:0 10px;border-radius:11px;border:1px solid transparent;transition:background .2s,border-color .2s,opacity .25s,transform .3s var(--ease),height .3s var(--ease),margin .3s var(--ease);animation:rowin .45s var(--ease) both;animation-delay:calc(var(--i,0) * 28ms)}
@keyframes rowin{from{opacity:0;transform:translateY(-8px) scale(.985)}}
.row.leaving{opacity:0;transform:translateX(24px);height:0;margin-top:0;margin-bottom:0;border-width:0;pointer-events:none}
[dir=rtl] .row.leaving{transform:translateX(-24px)}
.row:hover{background:rgba(255,255,255,.035)}
.row.sel{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.35)}
.row.celebrate{animation:celebrate 1.1s var(--ease)}
@keyframes celebrate{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);background:rgba(52,211,153,.14)}100%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
.row.celebrate .ficon{animation:pop .6s var(--spring)}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}}
.name{display:flex;align-items:center;gap:11px;min-width:0}
.ficon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:10px;font-weight:700;letter-spacing:.3px;position:relative}
.ficon .from{position:absolute;bottom:-3px;inset-inline-end:-3px;width:15px;height:15px;border-radius:50%;background:#1e2130;border:1px solid var(--line-2);display:grid;place-items:center}
.ficon .from svg{width:9px;height:9px;color:#93c5fd}
.name .t{min-width:0}
.name .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:560}
.name .host{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{color:var(--muted);font-size:12.5px}
.prog{display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:var(--grad);transition:width .55s var(--ease),background .4s}
.bar.done i{background:var(--ok)}
.bar.paused i{background:var(--warn)}
.bar.failed i{background:var(--bad)}
.bar.waiting i{background:rgba(96,165,250,.6)}
.bar.live i{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),var(--grad);background-size:22px 22px,100% 100%;animation:stripes .7s linear infinite}
[dir=rtl] .bar.live i{animation-direction:reverse}
@keyframes stripes{to{background-position:22px 0,0 0}}
.prog .pct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{justify-self:start;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;transition:background .3s,color .3s;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.downloading{color:#93c5fd;background:rgba(96,165,250,.12)}
.pill.downloading::before{animation:pulse 1.2s ease-in-out infinite}
.pill.connecting{color:#c4b5fd;background:rgba(139,92,246,.14)}
.pill.connecting::before{animation:pulse .7s ease-in-out infinite}
.pill.queued{color:var(--muted);background:rgba(255,255,255,.06)}
.pill.scheduled{color:#93c5fd;background:rgba(96,165,250,.08)}
.pill.paused{color:var(--warn);background:rgba(251,191,36,.12)}
.pill.completed{color:var(--ok);background:rgba(52,211,153,.12)}
.pill.failed{color:var(--bad);background:rgba(248,113,113,.12)}
@keyframes pulse{50%{opacity:.3}}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--panel-2);color:var(--text)}
.ib.danger:hover{color:var(--bad);background:rgba(248,113,113,.1)}
.ib.confirm{color:var(--bad);background:rgba(248,113,113,.16);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.ib svg{width:16px;height:16px}

.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}
.empty .art{width:86px;height:86px;border-radius:24px;margin:0 auto 16px;background:linear-gradient(160deg,rgba(139,92,246,.25),rgba(34,211,238,.12));border:1px solid rgba(139,92,246,.3);display:grid;place-items:center;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty .art svg{width:40px;height:40px;color:#c4b5fd}
.empty h3{color:var(--text);margin:0 0 6px;font-size:16px}
.empty p{margin:0;font-size:13px}
.empty kbd{font:11.5px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel-2)}

/* ---------- details ---------- */
.details{display:grid;grid-template-columns:1fr 300px;gap:18px;padding:16px 18px;min-height:0;animation:panelIn .45s var(--ease)}
.details.hide{display:none}
.dleft{min-width:0;display:flex;flex-direction:column;gap:12px}
.dtitle{display:flex;align-items:center;gap:10px;min-width:0}
.dtitle b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtitle span{font-size:12px;color:var(--faint);white-space:nowrap}
.d-thumb{width:64px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--line);display:none;flex:none}
.lbl2{display:flex;justify-content:space-between;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin-bottom:6px}
.lbl2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block;width:100%}
#segs{height:34px;border-radius:8px}
#graph{height:74px}
.info{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;align-content:start;margin:0}
.info dt{color:var(--faint)}
.info dd{margin:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;user-select:text}
.dbtns{display:flex;gap:8px;margin-top:12px}
.dbtns button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px}
.dbtns button:hover:not(:disabled){border-color:var(--line-2)}
.dbtns button:disabled{opacity:.35;cursor:default}

/* ---------- toasts / overlays ---------- */
.toasts{position:fixed;inset-inline-end:26px;top:92px;display:flex;flex-direction:column;gap:10px;z-index:40}
.toast{min-width:280px;max-width:380px;padding:12px 14px;border-radius:12px;background:rgba(22,24,34,.94);border:1px solid var(--line-2);backdrop-filter:blur(20px);display:flex;gap:11px;align-items:flex-start;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);animation:tin .4s var(--spring)}
.toast.out{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.toast .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 0 0 currentColor;animation:ring 1.2s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(255,255,255,.35)}to{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.toast b{display:block;font-size:13px}
.toast span{font-size:12px;color:var(--muted);word-break:break-word}
.drop{position:fixed;inset:12px;border-radius:18px;border:2px dashed rgba(139,92,246,.8);background:rgba(76,29,149,.25);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;font-size:18px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;transform:scale(1.01)}
.drop.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(7,8,13,.85);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:60;text-align:center;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.powerbar{position:fixed;top:18px;left:50%;transform:translate(-50%,-140%);z-index:45;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:14px;background:rgba(40,20,24,.95);border:1px solid rgba(248,113,113,.45);box-shadow:0 20px 50px -14px rgba(0,0,0,.8);transition:transform .45s var(--spring)}
.powerbar.on{transform:translate(-50%,0)}
.powerbar b{font-size:13.5px}
.powerbar .cd{font:600 20px var(--font);color:#fecaca;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
.powerbar button{height:32px;padding:0 14px;border-radius:9px;background:rgba(248,113,113,.2);color:#fecaca;font-weight:600}
.powerbar button:hover{background:rgba(248,113,113,.32)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.62);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:25;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.modal.on{opacity:1;pointer-events:auto}
.mbox{width:560px;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);overflow-y:auto;border-radius:18px;background:rgba(20,22,32,.97);border:1px solid var(--line-2);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);padding:22px;transform:translateY(14px) scale(.96);transition:transform .4s var(--spring)}
.modal.on .mbox{transform:none}
.mbox::-webkit-scrollbar{width:8px}.mbox::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mhead b{font-size:15px}.mhead .x{margin-inline-start:auto}
.vinfo{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.vthumb{width:176px;height:99px;border-radius:10px;object-fit:cover;background:#111522;flex:none;border:1px solid var(--line)}
.vmeta{min-width:0}
.vmeta .vt{font-weight:650;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;user-select:text}
.vmeta .vs{color:var(--muted);font-size:12.5px;margin-top:6px}
.qlabel{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin-bottom:8px}
.qgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q{padding:8px 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;font-weight:560}
.q:hover{border-color:rgba(139,92,246,.6)}
.q.on{background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.9);color:#fff}
.mnote{font-size:12px;color:var(--muted);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);border-radius:9px;padding:8px 10px;margin-bottom:12px}
.mfoot{display:flex;align-items:center;gap:10px}
.mfoot small{color:var(--faint);font-size:11.5px;flex:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--a2);animation:rot .8s linear infinite;margin:6px auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
.mcenter{text-align:center;color:var(--muted);padding:10px 0 4px}
.mcenter p{margin:6px 0 14px;font-size:13px}
.skel{border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* settings */
.settings .mbox{width:640px;padding:0}
.settings .mhead{padding:20px 22px 0;margin-bottom:10px}
.stabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);position:relative}
.stab{padding:10px 12px;color:var(--muted);font-size:13px;position:relative}
.stab.on{color:var(--text)}
.stabind{position:absolute;bottom:-1px;height:2px;border-radius:2px;background:var(--grad);transition:left .35s var(--ease),width .35s var(--ease),right .35s var(--ease)}
.spanes{padding:18px 22px 22px;min-height:360px}
.spane{display:none;animation:paneIn .35s var(--ease)}
.spane.on{display:block}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
.srow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lab{flex:1;min-width:0}
.srow .lab b{display:block;font-size:13.5px;font-weight:600}
.srow .lab span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;position:relative}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{color:#fff}
.seg .segind{position:absolute;top:3px;bottom:3px;border-radius:7px;background:rgba(139,92,246,.35);box-shadow:inset 0 0 0 1px rgba(139,92,246,.7);transition:left .35s var(--ease),width .35s var(--ease)}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;color:var(--text);font-size:13px}
.inp:focus{border-color:rgba(139,92,246,.7)}
select.inp{cursor:pointer}
input[type=time].inp{color-scheme:dark;width:116px}
.dirbox{display:flex;gap:6px;width:310px}
.dirbox .inp{flex:1;min-width:0;font-size:12px}
.tog{width:40px;height:23px;border-radius:20px;background:#2a2d3a;position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tog.on{background:var(--a1)}
.tog.on::after{transform:translateX(17px)}
[dir=rtl] .tog.on::after{transform:translateX(-17px)}
.sbtn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);font-size:12.5px;white-space:nowrap}
.sbtn:hover:not(:disabled){border-color:rgba(139,92,246,.6)}
.sbtn:disabled{opacity:.4;cursor:default}
.sbtn.primary{background:var(--grad);border:0;color:#fff;font-weight:600}
.keybox{display:flex;gap:6px;align-items:center}
.keybox code{font:12.5px var(--mono);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:7px 10px;direction:ltr;user-select:all;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{margin:6px 0 0;padding-inline-start:20px;color:var(--muted);font-size:12.5px;line-height:1.7}
.steps code{font:11.5px var(--mono);color:#c4b5fd}
.statusline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.statusline i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.statusline.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.statusline.warn i{background:var(--warn)}
.updbox{border-radius:12px;padding:12px 14px;margin-top:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);display:none}
.updbox.on{display:block;animation:panelIn .4s var(--ease)}
.updbox b{display:block}
.updbox pre{white-space:pre-wrap;font:12px var(--font);color:var(--muted);margin:6px 0 10px;max-height:120px;overflow:auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <aside class="side glass enter">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M13.5 2 5 14h6l-1.5 8L19 9.5h-6z" fill="#fff"/></svg></div>
      <div><b>FastGrab</b><small id="ver" class="ltr"></small></div>
    </div>
    <div class="navs" id="navs">
      <div class="navind" id="navind"></div>
      <button class="nav on" data-f="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-t="f_all"></span><span class="n" id="n-all">0</span></button>
      <button class="nav" data-f="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg><span data-t="f_active"></span><span class="n" id="n-active">0</span></button>
      <button class="nav" data-f="completed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/></svg><span data-t="f_completed"></span><span class="n" id="n-completed">0</span></button>
      <button class="nav" data-f="stopped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M10 9v6m4-6v6"/></svg><span data-t="f_stopped"></span><span class="n" id="n-stopped">0</span></button>
      <div class="sec" data-t="categories"></div>
      <button class="nav" data-f="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span data-t="f_video"></span><span class="n" id="n-video">0</span></button>
      <button class="nav" data-f="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-t="f_audio"></span><span class="n" id="n-audio">0</span></button>
      <button class="nav" data-f="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 3v2m0 3v2m0 3v2"/></svg><span data-t="f_archive"></span><span class="n" id="n-archive">0</span></button>
      <button class="nav" data-f="doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span data-t="f_doc"></span><span class="n" id="n-doc">0</span></button>
      <button class="nav" data-f="app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg><span data-t="f_app"></span><span class="n" id="n-app">0</span></button>
    </div>

    <div class="grow"></div>
    <div class="card updcard" id="updcard"><b id="updtitle"></b><span id="updsub"></span><button id="updbtn"></button></div>
    <div class="card schedcard" id="schedcard"><b id="schedtitle"></b><span id="schedsub"></span></div>
    <div class="card speedcard">
      <div class="lbl" data-t="total_speed"></div>
      <div class="val ltr" id="tspeed">0 B/s</div>
      <div class="sub" id="tsub"></div>
    </div>
    <div class="sidebtns">
      <button class="sidebtn" id="openSettings"><svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></button>
    </div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="addbar glass enter" style="animation-delay:.05s">
      <div class="url">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
        <input id="url" spellcheck="false" autocomplete="off" dir="auto">
      </div>
      <div class="conns"><span data-t="connections"></span>
        <select id="conns"><option>1</option><option>2</option><option>4</option><option>8</option><option>12</option><option>16</option><option>24</option><option>32</option></select>
      </div>
      <button class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg><span data-t="download"></span></button>
    </div>

    <section class="listwrap glass enter" style="animation-delay:.1s">
      <div class="listhead">
        <h2 id="title"></h2><span class="hint" id="hint"></span>
        <span class="sp"></span>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" spellcheck="false" dir="auto"></div>
        <button class="ghost" id="clear" data-t="clear_completed"></button>
      </div>
      <div class="cols"><span data-t="c_name"></span><span data-t="c_size"></span><span data-t="c_progress"></span><span data-t="c_speed"></span><span data-t="c_left"></span><span data-t="c_status"></span><span></span></div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty">
        <div>
          <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg></div>
          <h3 id="emptyTitle"></h3>
          <p id="emptyText"></p>
        </div>
      </div>
    </section>

    <section class="details glass hide" id="details">
      <div class="dleft">
        <div class="dtitle"><img class="d-thumb" id="d-thumb" alt=""><b id="d-name" dir="auto"></b><span id="d-sub" class="ltr"></span></div>
        <div>
          <div class="lbl2"><span data-t="conn_map"></span><em id="d-conns"></em></div>
          <canvas id="segs"></canvas>
        </div>
        <div>
          <div class="lbl2"><span data-t="speed"></span><em id="d-speed"></em></div>
          <canvas id="graph"></canvas>
        </div>
      </div>
      <div>
        <dl class="info">
          <dt data-t="i_status"></dt><dd id="d-status"></dd>
          <dt data-t="i_done"></dt><dd id="d-done"></dd>
          <dt data-t="i_saved"></dt><dd id="d-dir" dir="ltr"></dd>
          <dt data-t="i_source"></dt><dd id="d-url" dir="ltr"></dd>
          <dt data-t="i_resume"></dt><dd id="d-res"></dd>
          <dt data-t="i_added"></dt><dd id="d-added"></dd>
        </dl>
        <div class="dbtns"><button id="d-open" data-t="open_file"></button><button id="d-folder" data-t="show_folder"></button></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="vmodal"><div class="mbox" id="vbox"></div></div>

<div class="modal settings" id="smodal"><div class="mbox">

      <div class="srow"><div class="lab"><b data-t="max_active"></b><span data-t="max_active_d"></span></div>
        <select class="inp" id="s-max"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select></div>
    </div>
    <div class="spane" data-p="schedule">
      <div class="srow"><div class="lab"><b data-t="sched_on"></b><span data-t="sched_on_d"></span></div><button class="tog" id="s-sched"></button></div>
      <div class="srow"><div class="lab"><b data-t="sched_from"></b><span data-t="sched_from_d"></span></div>
        <div style="display:flex;gap:8px;align-items:center" class="ltr"><input type="time" class="inp" id="s-start"><span style="color:var(--faint)">–</span><input type="time" class="inp" id="s-stop"></div></div>

        <select class="inp" id="s-done"><option value="none" data-t="wd_none"></option><option value="quit" data-t="wd_quit"></option><option value="sleep" data-t="wd_sleep"></option><option value="shutdown" data-t="wd_shutdown"></option></select></div>
    </div>
    <div class="spane" data-p="updates">

    </div>
    <div class="spane" data-p="browser">
      <div class="srow"><div class="lab"><b data-t="ext_title"></b><span data-t="ext_d"></span></div></div>
      <div class="srow"><div class="lab"><b data-t="pair_key"></b><span id="e-status" class="statusline"></span></div>
        <div class="keybox"><code id="e-key"></code><button class="sbtn" id="e-copy" data-t="copy"></button></div></div>
      <div class="srow" style="display:block">

      </div>
    </div>
  </div>
</div></div>

/* ---- canvases (the connections map is animated at 60 fps between updates) */
function setupCanvas(cv, mirror){

      return [s[0], o[1] + (s[1]-o[1])*k, o[2] + (s[2]-o[2])*k, s[3]]; });

function drawGraph(h){

  trace(); ctx.lineTo(pts[pts.length-1][0],H); ctx.lineTo(pts[0][0],H); ctx.closePath();

  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),300); }, 4200);
}

/* ================================================================== polling */
let failures = 0;
async function poll(){
  let s;
  try { s = await api("/api/state"); }
  catch(e){ if (++failures>=4 && !restarting) $("#offline").classList.add("on"); return; }
  if (failures && restarting){ location.reload(); return; }       // back after a restart
  failures = 0; $("#offline").classList.remove("on");
  if (firstVersion===null) firstVersion = s.version;
  else if (s.version !== firstVersion){ location.reload(); return; } // updated: load the new interface
  state = s;
  if (state.settings.lang !== LANG) applyLang(state.settings.lang);
  $("#ver").textContent = "v"+state.version;
  for (const it of state.items){
    const h = hist[it.id] || (hist[it.id]=[]);
    if (it.status==="downloading"){ h.push(it.speed||0); if (h.length>120) h.shift(); }
    const prev = seenStatus[it.id];
    if (prev && prev!==it.status){
      if (it.status==="completed"){ toast(t("t_complete"), it.filename, "#34d399"); const el=rowEls.get(it.id); if(el){ el.classList.remove("celebrate"); void el.offsetWidth; el.classList.add("celebrate"); } }
      if (it.status==="failed") toast(t("t_failed"), msgText(it.message) || it.filename, "#f87171");
    }
    seenStatus[it.id] = it.status;
  }
  handleEvents();
  render(); renderPower(); watchInstall();
  if ($("#smodal").classList.contains("on")) renderSettings();
}
function handleEvents(){
  const evs = state.events || [];
  if (seenEvents===null){ seenEvents = new Set(evs.map(e=>e.id)); return; }
  for (const e of evs){
    if (seenEvents.has(e.id)) continue;
    seenEvents.add(e.id);
    if (e.type==="video") openVideo(e.url);
    if (e.type==="added"){ const it = state.items.find(i=>i.id===e.item); toast(t("t_from_browser"), it ? it.filename : "", "#60a5fa"); selected = e.item; }
  }
}
function renderPower(){
  const p = state.power || {};
  $("#powerbar").classList.toggle("on", !!p.action);
  if (p.action){ $("#pcd").textContent = p.seconds; $("#ptext").textContent = `${t("p_"+p.action)} ${t("p_in",{s:p.seconds})}`; }
}

/* ================================================================== actions */
async function add(text){
  const urls = String(text||"").split(/\s+/).filter(u=>/^https?:\/\//i.test(u));
  if (!urls.length){ toast(t("t_notlink"),t("t_notlink_d"),"#fbbf24"); return; }
  if (urls.length===1 && isVideoLink(urls[0])){ $("#url").value=""; openVideo(urls[0]); return; }
  if (urls.some(isVideoLink) && !(state.video||{}).available){ openVideo(urls.find(isVideoLink)); return; }
  try{
    const r = await api("/api/add",{urls, connections:+$("#conns").value});
    $("#url").value=""; selected = r.ids[0]; setFilter("all");
    toast(urls.length>1 ? t("t_added_n",{n:urls.length}) : t("t_started"), urls.length>1?"":host(urls[0]), "#8b5cf6");
    poll();
  }catch(e){ toast(t("t_cantadd"), e.message, "#f87171"); }
}
function setFilter(f, quiet){
  filter=f; document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.f===f));
  const nav = document.querySelector(`.nav[data-f="${f}"]`);
  $("#title").textContent = t("f_"+f);
  const ind = $("#navind"); if (nav){ ind.style.opacity=1; ind.style.transform=`translateY(${nav.offsetTop}px)`; }
  if (!quiet) render(true); else render();
}
async function restartApp(){ restarting = true; $("#restarting").classList.add("on"); try{ await api("/api/restart",{}); }catch{} }
async function installUpdate(){ try{ await api("/api/update/install",{}); poll(); }catch(e){ toast(t("upd_err",{e:e.message}),"","#f87171"); } }

$("#go").onclick = () => add($("#url").value);
$("#url").addEventListener("keydown", e => { if (e.key==="Enter") add($("#url").value); });
$("#q").addEventListener("input", e => { query=e.target.value.toLowerCase().trim(); render(true); });
document.querySelectorAll(".nav").forEach(n => n.onclick = () => setFilter(n.dataset.f));
$("#clear").onclick = () => api("/api/clear-completed",{}).then(poll);
$("#conns").onchange = () => api("/api/settings",{connections:+$("#conns").value});
$("#d-open").onclick = () => api("/api/action",{id:selected,action:"open"}).catch(e=>toast(t("t_action"),e.message,"#f87171"));
$("#d-folder").onclick = () => api("/api/action",{id:selected,action:"folder"}).catch(e=>toast(t("t_action"),e.message,"#f87171"));
$("#pcancel").onclick = () => api("/api/cancel-power",{}).then(poll);
$("#rows").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const btn = e.target.closest("[data-act]");
  selected = row.dataset.id;
  if (btn){
    const act = btn.dataset.act;
    if (act==="cancel" && !btn.classList.contains("confirm")){
      btn.classList.add("confirm"); btn.title=t("a_confirm");
      setTimeout(()=>{ btn.classList.remove("confirm"); btn.title=t("a_cancel"); }, 2500); return;
    }
    api("/api/action",{id:selected, action:act}).then(poll).catch(err=>toast(t("t_action"),err.message,"#f87171"));
  }
  render();
});
$("#rows").addEventListener("dblclick", e => {
  const row = e.target.closest(".row"); if (!row || e.target.closest("[data-act]")) return;
  const it = state.items.find(i=>i.id===row.dataset.id);
  if (it && it.status==="completed") api("/api/action",{id:it.id,action:"open"}).catch(()=>{});
});
document.addEventListener("paste", e => {
  if (e.target.closest("input")) return;
  const s = e.clipboardData.getData("text"); if (/^https?:\/\//i.test(s.trim())){ $("#url").value=s.trim(); $("#url").focus(); }
});
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("#drop").classList.add("on"); });
document.addEventListener("dragleave", () => { if(--dragDepth<=0){ dragDepth=0; $("#drop").classList.remove("on"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); dragDepth=0; $("#drop").classList.remove("on");
  add(e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain")); });
window.addEventListener("resize", () => { renderDetails(); setFilter(filter,true); });
document.addEventListener("keydown", e => {
  if (e.key==="Escape"){ closeModal("vmodal"); closeModal("smodal"); }
  if (e.key==="Delete" && selected && !e.target.closest("input")){ const it=state.items.find(i=>i.id===selected); if(it&&it.status==="completed") api("/api/action",{id:selected,action:"remove"}).then(poll); }
});

/* =================================================================== modals */
function openModal(id){ $("#"+id).classList.add("on"); }
function closeModal(id){ $("#"+id).classList.remove("on"); if (id==="vmodal"){ vinfo=null; vurl=null; } }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeModal(b.dataset.close));
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target===m) closeModal(m.id); }));

/* ------------------------------------------------------------- video picker */
let vq = "best", vinfo = null, vurl = null;
function mhead(title){ return `<div class="mhead"><b>${esc(title)}</b><button class="ib x" onclick="closeModal('vmodal')">${svg(ICONS.x,2)}</button></div>`; }
async function openVideo(url){
  vurl = url; vinfo = null; openModal("vmodal");
  const v = state.video || {};
  if (!v.available) return showInstall();
  $("#vbox").innerHTML = mhead(t("v_title")) + `<div class="vinfo"><div class="vthumb skel"></div><div class="vmeta" style="flex:1"><div class="skel" style="height:16px;width:85%;margin-bottom:8px"></div><div class="skel" style="height:16px;width:60%;margin-bottom:12px"></div><div class="skel" style="height:12px;width:40%"></div></div></div><div class="mcenter"><p>${esc(t("v_getting",{h:host(url)}))}</p></div>`;
  try{
    const info = await api("/api/probe",{url});
    if (vurl !== url) return;
    vinfo = info; vq = info.choices.includes("1080") ? "1080" : info.choices[0];
    renderVideo();
  }catch(e){
    if (vurl !== url) return;
    $("#vbox").innerHTML = mhead(t("v_cant")) + `<div class="mcenter"><p>${esc(e.message)}</p><button class="ghost" onclick="closeModal('vmodal')">${esc(t("close"))}</button></div>`;
  }
}
function renderVideo(){
  const i = vinfo, dur = i.duration ? fmtTime(i.duration) : "";
  const notes = [];
  if (!i.ffmpeg && i.choices.length>2) notes.push(t("v_noffmpeg"));
  if (!i.js_runtime && /youtube/i.test(i.site||"")) notes.push(t("v_nojs"));
  $("#vbox").innerHTML = mhead(t("v_title")) + `
    <div class="vinfo">${i.thumbnail?`<img class="vthumb" src="${esc(i.thumbnail)}" alt="">`:`<div class="vthumb"></div>`}
      <div class="vmeta"><div class="vt" dir="auto">${esc(i.title)}</div><div class="vs" dir="auto">${esc([i.site,i.uploader,dur].filter(Boolean).join(" · "))}</div></div></div>
    <div class="qlabel">${esc(t("quality"))}</div>
    <div class="qgrid">${i.choices.map(c=>`<button class="q ${c===vq?"on":""}" data-q="${c}">${esc(qlabel(c))}</button>`).join("")}</div>
    ${notes.map(n=>`<div class="mnote">${esc(n)}</div>`).join("")}
    <div class="mfoot"><small>${esc(t("v_rights"))}</small>
      <button class="ghost" onclick="closeModal('vmodal')">${esc(t("cancel"))}</button>
      <button class="go" id="vgo">${svg('<path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/>',2.2)}${esc(t("download"))}</button></div>`;
  $("#vbox").querySelectorAll(".q").forEach(b => b.onclick = () => { vq=b.dataset.q; $("#vbox").querySelectorAll(".q").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#vgo").onclick = async () => {
    try{
      const r = await api("/api/add",{urls:[vurl], kind:"video", choice:vq, connections:+$("#conns").value,
                                      meta:{title:i.title, site:i.site, thumbnail:i.thumbnail}});
      selected = r.ids[0]; closeModal("vmodal"); setFilter("all"); toast(t("v_started"), i.title, "#8b5cf6"); poll();
    }catch(e){ toast(t("t_cantadd"), e.message, "#f87171"); }
  };
}
function showInstall(){
  const v = state.video || {};
  $("#vbox").innerHTML = mhead(t("v_add")) + `<div class="mcenter">
    ${v.installing ? `<div class="spin"></div><p>${esc(t("v_installing"))}</p>`
    : `<p>${t("v_need")}</p>${v.install_error?`<div class="mnote" style="text-align:start">${esc(v.install_error)}</div>`:""}
       <button class="go" style="margin:0 auto" id="vinstall">${esc(t("v_install"))}</button>`}</div>`;
  const b = $("#vinstall"); if (b) b.onclick = () => api("/api/install-video",{}).then(()=>{ state.video.installing=true; showInstall(); });
}
let wasInstalling = false;
function watchInstall(){
  const v = state.video || {};
  if ($("#vmodal").classList.contains("on") && !vinfo && vurl){
    if (v.installing || (!v.available && wasInstalling !== v.installing)) showInstall();
    if (wasInstalling && !v.installing && v.available){ toast(t("v_installed"),t("v_installed_d"),"#34d399"); openVideo(vurl); }
  }
  wasInstalling = !!v.installing;
}

/* ----------------------------------------------------------------- settings */
let spane = "general";
function positionSeg(seg){ if (!seg) return; const on = seg.querySelector("button.on"), ind = seg.querySelector(".segind"); if (on && ind){ ind.style.left = on.offsetLeft+"px"; ind.style.width = on.offsetWidth+"px"; } }
function positionTab(){ const on = document.querySelector(`.stab[data-p="${spane}"]`), ind = $("#stabind"); if (on){ ind.style.left = on.offsetLeft+"px"; ind.style.width = on.offsetWidth+"px"; } }
function setTog(el, v){ el.classList.toggle("on", !!v); }
function renderSettings(){
  const s = state.settings, sc = s.schedule || {}, u = state.update || {}, a = u.app || {};
  document.querySelectorAll("#langseg button").forEach(b => b.classList.toggle("on", b.dataset.v===s.lang)); positionSeg($("#langseg"));
  if (document.activeElement !== $("#s-dir")) $("#s-dir").value = s.dir || "";
  $("#s-conns").value = String(s.connections); $("#s-max").value = String(s.max_active);
  setTog($("#s-sched"), sc.enabled);
  if (document.activeElement !== $("#s-start")) $("#s-start").value = sc.start;
  if (document.activeElement !== $("#s-stop")) $("#s-stop").value = sc.stop;
  const ss = $("#s-schedstate"); ss.className = "statusline " + (!sc.enabled ? "" : state.schedule_open ? "ok" : "warn");
  ss.innerHTML = `<i></i>${esc(!sc.enabled ? t("sched_off") : state.schedule_open ? t("sched_open") : t("sched_closed",{t:sc.start}))}`;
  $("#s-done").value = s.when_done;
  // updates
  $("#u-app").textContent = "v"+state.version;
  const vv = (state.video||{}).version;
  $("#u-video").textContent = vv ? t("video_ver",{v:vv}) : t("video_none");
  $("#u-check").disabled = !!u.busy; $("#u-check").textContent = u.busy==="checking" ? t("checking") : t("check_now");
  const box = $("#u-box"); box.classList.toggle("on", !!(a.available || u.restart_needed));
  if (u.restart_needed){ $("#u-boxtitle").textContent = a.installed ? t("upd_ready") : t("video_updated",{v:(u.video||{}).updated_to||""}); $("#u-notes").textContent = t("upd_restart_d"); $("#u-install").textContent = t("upd_restart"); $("#u-install").onclick = restartApp; }
  else if (a.available){ $("#u-boxtitle").textContent = t("upd_avail",{v:a.latest}); $("#u-notes").textContent = a.notes||"";
    $("#u-install").textContent = u.busy==="installing" ? t("installing") : t("upd_install",{v:a.latest}); $("#u-install").disabled = !!u.busy; $("#u-install").onclick = installUpdate; }
  const us = $("#u-status");
  us.className = "statusline " + (u.error ? "warn" : u.last_check ? "ok" : "");
  us.innerHTML = `<i></i>${esc(u.error ? t("upd_err",{e:u.error}) : u.last_check ? (a.available ? t("upd_avail",{v:a.latest}) : t("up_to_date")) + " · " + t("last_checked",{t:ago(u.last_check)}) : t("never_checked"))}`;
  setTog($("#s-autovideo"), s.auto_update_video); setTog($("#s-autoapp"), s.check_app_updates);
  // browser extension
  $("#e-key").textContent = s.ext_key || "";
  const es = $("#e-status");
  es.className = "statusline " + (!state.ext_port_ok ? "warn" : state.ext_seen ? "ok" : "");
  es.innerHTML = `<i></i>${esc(!state.ext_port_ok ? t("ext_port") : state.ext_seen ? t("ext_seen",{t:ago(state.ext_seen)}) : t("ext_never"))}`;
}
const saveSetting = body => api("/api/settings", body).then(poll).catch(e=>toast(t("t_action"),e.message,"#f87171"));
$("#openSettings").onclick = () => { openModal("smodal"); renderSettings(); requestAnimationFrame(()=>{ positionTab(); positionSeg($("#langseg")); }); };
document.querySelectorAll(".stab").forEach(b => b.onclick = () => { spane = b.dataset.p;
  document.querySelectorAll(".stab").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".spane").forEach(p=>p.classList.toggle("on",p.dataset.p===spane)); positionTab(); positionSeg($("#langseg")); });
document.querySelectorAll("#langseg button").forEach(b => b.onclick = () => { applyLang(b.dataset.v); saveSetting({lang:b.dataset.v}); });
$("#s-dir").addEventListener("change", e => saveSetting({dir:e.target.value.trim()}).then(()=>toast(t("t_folder"),e.target.value,"#8b5cf6")));
$("#s-pick").onclick = () => api("/api/pick-folder",{}).then(r=>{ $("#s-dir").value=r.dir; if(!r.picked) $("#s-dir").focus(); poll(); }).catch(e=>toast(t("t_action"),e.message,"#f87171"));
$("#s-conns").onchange = e => { $("#conns").value = e.target.value; saveSetting({connections:+e.target.value}); };
$("#s-max").onchange = e => saveSetting({max_active:+e.target.value});
$("#s-sched").onclick = () => saveSetting({schedule:{enabled:!state.settings.schedule.enabled}});
$("#s-start").addEventListener("change", e => saveSetting({schedule:{start:e.target.value}}));
$("#s-stop").addEventListener("change", e => saveSetting({schedule:{stop:e.target.value}}));
$("#s-done").onchange = e => saveSetting({when_done:e.target.value});
$("#s-autovideo").onclick = () => saveSetting({auto_update_video:!state.settings.auto_update_video});
$("#s-autoapp").onclick = () => saveSetting({check_app_updates:!state.settings.check_app_updates});
$("#u-check").onclick = () => api("/api/update/check",{}).then(poll);
$("#e-copy").onclick = () => navigator.clipboard.writeText(state.settings.ext_key||"").then(()=>toast(t("t_copied"),"","#8b5cf6")).catch(()=>{});
$("#e-newkey").onclick = () => saveSetting({new_ext_key:true}).then(()=>toast(t("new_key_t"),t("new_key_d"),"#fbbf24"));
$("#e-folder").onclick = () => api("/api/open-extension-folder",{}).catch(e=>toast(t("t_action"),e.message,"#f87171"));

/* ===================================================================== start */
api("/api/state").then(s => { $("#conns").value = String(s.settings.connections||8); applyLang(s.settings.lang||"en"); }).catch(()=>applyLang("en"));
requestAnimationFrame(animSegments); requestAnimationFrame(animSpeed);
poll(); setInterval(poll, 500);
</script>
</body>
