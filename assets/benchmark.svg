<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Download speed: browser 4.8 MB/s vs FastGrab up to 72.5 MB/s (15x faster)</title>
<rect width="880" height="470" rx="16" fill="#0f1117"/>
<text x="36" y="56" font-size="24" font-weight="700" fill="#eceef4">Same file, 15× faster</text>
<text x="36" y="84" font-size="14" fill="#a4a9b8">200 MB file from a server that limits each connection to 5 MB/s, like many real servers.</text>
<text x="36" y="104" font-size="14" fill="#a4a9b8">Every download was checked byte-for-byte (SHA-256).</text>
<text x="844" y="66" font-size="52" font-weight="800" fill="#eceef4" text-anchor="end">15×</text>
<text x="844" y="90" font-size="13" fill="#a4a9b8" text-anchor="end">faster than the browser</text>
<line x1="230.0" y1="136" x2="230.0" y2="374" stroke="#232733" stroke-width="1"/>
<text x="230.0" y="394" font-size="12" fill="#6e7486" text-anchor="middle">0 MB/s</text>
<line x1="347.5" y1="136" x2="347.5" y2="374" stroke="#232733" stroke-width="1"/>
<text x="347.5" y="394" font-size="12" fill="#6e7486" text-anchor="middle">20 MB/s</text>
<line x1="465.0" y1="136" x2="465.0" y2="374" stroke="#232733" stroke-width="1"/>
<text x="465.0" y="394" font-size="12" fill="#6e7486" text-anchor="middle">40 MB/s</text>
<line x1="582.5" y1="136" x2="582.5" y2="374" stroke="#232733" stroke-width="1"/>
<text x="582.5" y="394" font-size="12" fill="#6e7486" text-anchor="middle">60 MB/s</text>
<line x1="700.0" y1="136" x2="700.0" y2="374" stroke="#232733" stroke-width="1"/>
<text x="700.0" y="394" font-size="12" fill="#6e7486" text-anchor="middle">80 MB/s</text>
<text x="36" y="160" font-size="15" font-weight="600" fill="#eceef4">Browser</text>
<text x="36" y="179" font-size="12.5" fill="#a4a9b8">normal download, 1 connection</text>
<path d="M230,152.0 h24.2 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-24.2 z" fill="#5b6170"/>
<text x="270.2" y="169.0" font-size="15" font-weight="700" fill="#eceef4">4.8 MB/s</text>
<text x="349.0" y="169.0" font-size="13" fill="#a4a9b8">41.7 s</text>
<text x="36" y="222" font-size="15" font-weight="600" fill="#eceef4">FastGrab</text>
<text x="36" y="241" font-size="12.5" fill="#a4a9b8">8 connections (default)</text>
<path d="M230,214.0 h199.9 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-199.9 z" fill="#8b5cf6"/>
<text x="445.9" y="231.0" font-size="15" font-weight="700" fill="#eceef4">34.7 MB/s</text>
<text x="533.3" y="231.0" font-size="13" fill="#a4a9b8">5.8 s  ·  7.2×</text>
<text x="36" y="284" font-size="15" font-weight="600" fill="#eceef4">FastGrab</text>
<text x="36" y="303" font-size="12.5" fill="#a4a9b8">16 connections</text>
<path d="M230,276.0 h330.3 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-330.3 z" fill="#8b5cf6"/>
<text x="576.3" y="293.0" font-size="15" font-weight="700" fill="#eceef4">56.9 MB/s</text>
<text x="663.7" y="293.0" font-size="13" fill="#a4a9b8">3.5 s  ·  11.9×</text>
<text x="36" y="346" font-size="15" font-weight="600" fill="#eceef4">FastGrab</text>
<text x="36" y="365" font-size="12.5" fill="#a4a9b8">32 connections</text>
<path d="M230,338.0 h421.9 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-421.9 z" fill="#8b5cf6"/>
<text x="667.9" y="355.0" font-size="15" font-weight="700" fill="#eceef4">72.5 MB/s</text>
<text x="755.3" y="355.0" font-size="13" fill="#a4a9b8">2.8 s  ·  15.1×</text>
<rect x="24" y="408" width="832" height="40" rx="10" fill="#161924"/>
<text x="44" y="433" font-size="13.5" fill="#a4a9b8"><tspan fill="#eceef4" font-weight="700">No server limit:</tspan> the engine moves up to <tspan fill="#eceef4" font-weight="700">380 MB/s (≈3 Gbit/s)</tspan>, faster than 1 Gbit/s home fiber.</text>
</svg>